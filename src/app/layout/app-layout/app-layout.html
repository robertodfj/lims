<div class="shell">
  <aside class="shell__sidebar">
    <app-sidebar />
  </aside>

  <div class="shell__main">
    <header class="topbar">
      <div class="breadcrumb">
        @for (crumb of breadcrumb(); track crumb; let last = $last) {
          <span class="breadcrumb__item" [class.is-last]="last">{{ crumb }}</span>
          @if (!last) {
            <span class="breadcrumb__sep">/</span>
          }
        }
      </div>

      <div class="topbar__right">
        <label class="search-input topbar__search">
          <app-icon name="search" [size]="15" />
          <input class="input" type="text" placeholder="Buscar…" />
        </label>
        @if (!aiPinned()) {
          <button
            type="button"
            class="account-btn"
            [class.is-active]="aiStore.open()"
            (click)="aiStore.toggle()"
            aria-label="Asistente IA"
          >
            <app-icon name="sparkle" [size]="15" />
          </button>
        }
        <button type="button" class="account-btn" aria-label="Cuenta">
          <app-icon name="user" [size]="15" />
        </button>
      </div>
    </header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>

  <aside class="ai-panel" [class.is-open]="aiPanelOpen()">
    <app-ai-assistant-panel [isOpen]="aiPanelOpen()" [pinned]="aiPinned()" />
  </aside>
</div>
