<button type="button" class="btn btn--secondary" (click)="exportar()">
  <svg class="excel-icon" width="14" height="14" viewBox="0 0 20 20" fill="none">
    <rect x="2" y="2" width="16" height="16" rx="3" fill="#1D6F42" />
    <path d="M6.2 6.2L9.3 10l-3.1 3.8h1.9L10 11l1.9 2.8h1.9L10.7 10l3.1-3.8h-1.9L10 9l-1.9-2.8H6.2z" fill="#fff" />
  </svg>
  Exportar a Excel
</button>
<button type="button" class="btn btn--secondary" (click)="importOpen.set(true)">
  <svg class="excel-icon" width="14" height="14" viewBox="0 0 20 20" fill="none">
    <rect x="2" y="2" width="16" height="16" rx="3" fill="#1D6F42" />
    <path d="M6.2 6.2L9.3 10l-3.1 3.8h1.9L10 11l1.9 2.8h1.9L10.7 10l3.1-3.8h-1.9L10 9l-1.9-2.8H6.2z" fill="#fff" />
  </svg>
  Importar de Excel
</button>

<app-modal [open]="importOpen()" title="Importar de Excel" size="sm" (closed)="cerrarImport()">
  <div
    class="excel-drop"
    [class.is-dragover]="dragOver()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <svg class="excel-icon excel-icon--lg" width="36" height="36" viewBox="0 0 20 20" fill="none">
      <rect x="2" y="2" width="16" height="16" rx="3" fill="#1D6F42" />
      <path d="M6.2 6.2L9.3 10l-3.1 3.8h1.9L10 11l1.9 2.8h1.9L10.7 10l3.1-3.8h-1.9L10 9l-1.9-2.8H6.2z" fill="#fff" />
    </svg>
    <p class="excel-drop__text">Arrastra aquí tu archivo o</p>
    <label class="btn btn--secondary btn--sm excel-drop__browse">
      Buscar archivo
      <input type="file" accept=".xlsx,.xls,.csv" (change)="onFileSelected($event)" />
    </label>
    <p class="excel-drop__hint">Formatos admitidos: .xlsx, .xls, .csv</p>
    @if (selectedFileName()) {
      <p class="excel-drop__filename">{{ selectedFileName() }}</p>
    }
  </div>

  <div modalFooter>
    <button type="button" class="btn btn--secondary" (click)="cerrarImport()">Cancelar</button>
    <button type="button" class="btn btn--primary" disabled title="Pendiente de implementar">Importar</button>
  </div>
</app-modal>
