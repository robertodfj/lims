<div class="drawer-overlay" [class.is-open]="open()" (click)="requestClose()"></div>

<aside
  class="drawer"
  [class.is-open]="open()"
  [class.drawer--lg]="size() === 'lg'"
  [class.drawer--xl]="size() === 'xl'"
  [attr.aria-hidden]="!open()"
>
  <header class="drawer__header">
    <div class="drawer__header-left">
      <ng-content select="[drawerStepNav]" />
      <h2 class="drawer__title">{{ title() }}</h2>
    </div>
    <button type="button" class="btn btn--ghost btn--icon" (click)="requestClose()" aria-label="Cerrar">
      <app-icon name="x" [size]="16" />
    </button>
  </header>

  <div class="drawer__body">
    <ng-content />
  </div>

  <footer class="drawer__footer">
    <ng-content select="[drawerFooter]" />
  </footer>
</aside>
